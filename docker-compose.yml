# IT Ticketing (Vite + Firebase)
#
#   Browser -> web:80 (nginx, static files) ; the browser then talks to Firebase directly.
#
# Setup:  cp .env.example .env   (fill in the Firebase web app values)
# Run:    docker compose up -d --build        -> http://localhost:8080
#
# The VITE_* values are compiled into the JavaScript bundle at build time, so
# changing .env requires a rebuild (`docker compose up -d --build`).

services:
  web:
    build:
      context: .
      target: production
      args:
        BUILD_NUMBER: ${TAG:-dev}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?Set VITE_FIREBASE_API_KEY in .env}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?Set VITE_FIREBASE_AUTH_DOMAIN in .env}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?Set VITE_FIREBASE_PROJECT_ID in .env}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?Set VITE_FIREBASE_APP_ID in .env}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
    image: ticket-app/web:${TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:80"
    restart: unless-stopped
