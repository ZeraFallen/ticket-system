# IT Helpdesk Ticket System
#
#   Browser -> proxy:80 -> frontend (static)
#                       -> api:3000 -> db:3306
#
# Networks:
#   web-net : proxy, frontend, api   (what the proxy can reach)
#   db-net  : api, db                (internal only: DB is unreachable from outside/proxy)
#
# Only the proxy publishes a host port.

services:
  proxy:
    build: ./proxy
    image: ticket-app/proxy:${TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web-net

  frontend:
    build:
      context: ./frontend
      args:
        BUILD_NUMBER: ${TAG:-dev}
    image: ticket-app/frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - web-net

  api:
    build:
      context: ./api
      target: production
    image: ticket-app/api:${TAG:-latest}
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-ticket_user}
      DB_PASSWORD: ${DB_PASSWORD:-ticketpassword}
      DB_NAME: ${DB_NAME:-ticket_db}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - web-net
      - db-net

  db:
    build: ./db
    image: ticket-app/db:${TAG:-latest}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-ticket_db}
      MYSQL_USER: ${DB_USER:-ticket_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ticketpassword}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP: the temporary init server is socket-only, so
      # the API can't start until init.sql has really finished.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - db-net

volumes:
  db-data:

networks:
  web-net:
  db-net:
    internal: true
