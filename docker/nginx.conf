# Static file server for the built single-page app.
server_tokens off;
gzip on;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # NOTE: add_header in a location replaces the ones from the parent level,
    # so the two security headers are repeated in each location below.

    # Liveness endpoint (Docker healthcheck + Jenkins smoke test)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Vite output is content-hashed, so it can be cached "forever".
    # A missing file is a real 404, never the SPA fallback.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a new deploy is picked up.
    # Unknown paths fall back to it (client-side routing / deep links).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri $uri/ /index.html;
    }
}
